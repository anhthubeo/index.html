<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cuộc giải cứu phép thuật</title>
<style>
:root{--bg:#f3efe6;--fg:#1d1d1f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

p{margin:0;font-size:14px;opacity:.75;text-align:center;max-width:90vw}
</style>
</head>
<body>
<canvas id="g"></canvas>
<p>↑ / W / chạm nửa trên: nhảy (nhấn 2 lần = nhảy đôi, giữ để nhảy cao) · ↓ / chạm nửa dưới: trượt · Space / chạm mép phải: bắn · Đấu boss: ↓ lướt né (bất tử ngắn) · A: phượng hoàng phun lửa</p>
<script>
const c=document.getElementById('g'),x=c.getContext('2d'),W=800,H=450;
c.width=W;c.height=H;
const LV=[{g:250,sp:6,ob:.7},{g:300,sp:7.5,ob:.85},{g:350,sp:7.5,ob:1}];
let lv=0,GOAL=LV[0].g;
const TH=[
{nm:'Sân lâu đài',s:['#2b3a73','#7b8fc4','#f1d3a6'],sun:'#fff0c0',f:'#4a5a8a',n:'#33406b',p:'#3b3a45',t:'#a9a7b4',door:'#ffcc33',glow:'#fff3c4'},
{nm:'Rừng cấm',s:['#040812','#0e2a2a','#1d4a40'],sun:'#dfe9ff',f:'#0f2e2e',n:'#081c1c',p:'#0e1a14',t:'#58805a',door:'#7fe3b0',glow:'#d8ffe9'},
{nm:'Hầm bí mật',s:['#1a0f24','#3a1f4a','#6a3a6a'],sun:'#ffcf6b',f:'#4a2a5a',n:'#2a1636',p:'#17111f',t:'#9a7bd0',door:'#d6a8ff',glow:'#f3e1ff'}];
let best=0;try{best=+localStorage.getItem('pk')||0}catch(e){}
let S;
function reset(){
  GOAL=LV[lv].g;
  S={st:'play',cam:0,sp:5,t:0,d:0,sh:0,buf:0,hold:false,
     p:{x:150,y:340,vy:0,w:28,g:true,dj:1,sl:0,co:7},
     pl:[{x:-200,y:340,w:800}],ob:[],pt:[],rb:[],np:[],cd:0,fire:false,pc:1,cp:0,fb:[],pbolt:[],fbt:0,gx:600,ly:340};
  gen();
}
function gen(){
  while(S.gx<S.cam+W+400){
    if(!S.fin&&S.gx>GOAL*10-300){const fx0=S.gx+80;S.pl.push({x:fx0,y:S.ly,w:520});S.ob.push({t:'box',goal:1,x:fx0+300,y:S.ly-150,w:90,h:150});S.fin=1;S.gx=1e9;break}
    const gap=70+lv*20+Math.random()*(40+S.sp*8);
    let y=S.ly+(Math.random()*120-60);
    y=Math.max(230,Math.min(390,y));
    if(y<S.ly-70)y=S.ly-70;
    const w=280+Math.random()*260,px=S.gx+gap;
    S.pl.push({x:px,y,w});
    let ox=px+150;
    while(ox<px+w-110){
      if(Math.random()<LV[lv].ob){
        const mon=Math.random()<.45+lv*.1,ai=Math.random()<.4,sw=Math.random()<.25+lv*.1,box=Math.random()<.5,bh=[22,36,66,96][Math.random()*4|0];
        S.ob.push(mon?{t:'mon',x:ox,y:ai?y-72:y-40,by:ai?y-72:y-40,w:40,h:40,hp:ai?2:3,mh:ai?2:3,air:ai,ph:Math.random()*6,lim:px+5}:sw?{t:'saw',x:ox,by:y-60,y:y-60,w:30,h:30,am:34,ph:Math.random()*6}:box?{t:'box',x:ox,y:y-bh,w:bh>50?40:32,h:bh}:{t:'bar',x:ox,y:y-92,w:56,h:62});
        ox+=140+S.sp*13+Math.random()*50;
      }else ox+=130;
    }
    S.gx=px+w;S.ly=y;
  }
}
function dust(px,py,n){for(let i=0;i<n;i++)S.pt.push({x:px,y:py,vx:Math.random()*2-2.5,vy:-Math.random()*1.5,l:20+Math.random()*10})}
function die(){
  if(S.st!=='play')return;
  S.st='over';S.d=0;S.sh=14;
  const sc=Math.floor(S.p.x/10);
  if(sc>best){best=sc;try{localStorage.setItem('pk',best)}catch(e){}}
}
function up(){
  const p=S.p;S.t++;
  S.sp=LV[lv].sp+Math.min(1.5,p.x/3000);
  p.x+=S.sp;S.cam=p.x-150;
  if(S.buf>0)S.buf--;
  if(S.buf>0){
    if(p.co>0){p.vy=-12;p.co=0;S.buf=0;p.sl=0;dust(p.x+10,p.y,6)}
    else if(p.dj>0){p.vy=-11;p.dj--;S.buf=0;p.sl=0;dust(p.x+14,p.y,10)}
  }
  if(!S.hold&&p.vy<-4.5)p.vy=-4.5;
  p.vy=Math.min(16,p.vy+.6);
  const old=p.y;p.y+=p.vy;
  const was=p.g;p.g=false;
  for(const q of S.pl){
    if(p.x+p.w>q.x&&p.x<q.x+q.w){
      if(p.y>=q.y&&old<=q.y+4){p.y=q.y;p.vy=0;p.g=true}
      else if(p.y>q.y+14){die()}
      else if(p.y>q.y){p.y=q.y;p.vy=0;p.g=true}
    }
  }
  for(const o of S.ob){if(o.t==='box'&&p.x+p.w-4>o.x&&p.x+4<o.x+o.w){if(p.y>=o.y&&old<=o.y+4&&p.vy>=0){p.y=o.y;p.vy=0;p.g=true}else if(p.y>o.y&&p.y<=o.y+10&&old<=o.y+10){p.y=o.y;p.vy=0;p.g=true}if(o.goal&&p.g&&S.st==='play')finish();}}
  if(p.g){p.co=7;p.dj=1;if(!was)dust(p.x+10,p.y,8);if(S.t%6===0)dust(p.x+4,p.y,1)}
  else{p.co--;p.sl=0}
  if(p.sl>0)p.sl--;
  if(S.cd>0)S.cd--;
  if(S.fire&&S.cd<=0){S.rb.push({x:p.x+28,y:p.y-(p.sl>0?12:30)});S.cd=11}
  for(const b of S.rb)b.x+=S.sp+13;
  for(const o of S.ob){
    if(o.t==='saw')o.y=o.by+Math.sin(S.t*.07+o.ph)*o.am;
    if(o.t==='mon'){
      if(o.hit>0)o.hit--;
      if(o.air)o.y=o.by+Math.sin(S.t*.08+o.ph)*14;else o.x=Math.max(o.lim,o.x-1.3);
      for(const b of S.rb)if(b.x+16>o.x&&b.x<o.x+o.w&&b.y>o.y-8&&b.y<o.y+o.h+8){b.x=1e9;o.hp--;o.hit=6;if(o.hp<=0){o.dead=1;dust(o.x+20,o.y+20,12)}}
    }
  }
  S.rb=S.rb.filter(b=>b.x<S.cam+W+40);
  S.cp+=S.sp;if(S.cp>=600){S.cp-=600;if(S.pc<2)S.pc++}
  if(S.pf>0)S.pf--;
  for(const f of S.fb){f.x+=S.sp+14;for(const o of S.ob)if(o.t==='mon'&&!f.hit.includes(o)&&f.x+22>o.x&&f.x-22<o.x+o.w&&f.y+22>o.y&&f.y-22<o.y+o.h){f.hit.push(o);o.hp-=Math.ceil(o.hp/2);o.hit=8;if(o.hp<=0){o.dead=1;dust(o.x+20,o.y+20,16)}}}
  S.fb=S.fb.filter(f=>f.x<S.cam+W+60);
  S.fbt=(S.fbt||0)+1;
  if(S.fbt%60===0){let t2=null;for(const o of S.ob)if(o.t==='mon'&&o.x>S.p.x+60&&o.x<S.p.x+420&&(!t2||o.x<t2.x))t2=o;if(t2){S.pbolt.push({x:S.p.x-10,y:S.p.y-86,tg:t2});S.pf=5}}
  for(const q of S.pbolt){const tg=q.tg;if(!tg||tg.dead){q.x=-1e9;continue}q.x+=S.sp+11;q.y+=(tg.y+20-q.y)*.12;if(q.x+26>=tg.x&&q.x-26<=tg.x+tg.w){tg.hp-=2;tg.hit=6;if(tg.hp<=0){tg.dead=1;dust(tg.x+20,tg.y+20,12)}q.x=-1e9}}
  S.pbolt=S.pbolt.filter(q=>q.x>-1e8&&q.x<S.cam+W+60);
  S.ob=S.ob.filter(o=>!o.dead);
  const h=p.sl>0?24:48;
  for(const o of S.ob){
    if(p.x+p.w-4>o.x&&p.x+4<o.x+o.w&&p.y-4>o.y&&p.y-h+4<o.y+o.h){if(o.goal&&S.st==='play')finish();else die()}
  }
  if(p.y>H+80)die();
  
  for(const a of S.pt){a.x+=a.vx;a.y+=a.vy;a.l--}
  S.pt=S.pt.filter(a=>a.l>0);
  S.pl=S.pl.filter(q=>q.x+q.w>S.cam-200);
  S.ob=S.ob.filter(o=>o.x+o.w>S.cam-200);S.np=S.np.filter(n=>n.x>S.cam-200);
  gen();
}
function rr(a,b,w,h,r,f){x.fillStyle=f;x.beginPath();x.roundRect(a,b,w,h,r);x.fill()}
function girl(a,b,s){fig(a-17*s,b,s*.75,0);fig(a+17*s,b,s*.75,1);fig(a,b,s*.8,2)}

  x.fillStyle='#f2efe6';x.beginPath();x.moveTo(-7,-38);x.lineTo(0,-33);x.lineTo(7,-38);x.lineTo(5,-40);x.lineTo(0,-36);x.lineTo(-5,-40);x.closePath();x.fill();
  x.fillStyle=ac;x.beginPath();x.moveTo(0,-34);x.lineTo(-2.5,-29);x.lineTo(0,-22);x.lineTo(2.5,-29);x.closePath();x.fill();x.beginPath();x.arc(6,-30,2.4,0,7);x.fill();
  if(t===1){x.beginPath();x.ellipse(0,-37,9,3.5,0,0,7);x.fill();x.fillRect(4,-37,5,13)}

  x.strokeStyle='#8a5a2b';x.lineWidth=2.2;x.beginPath();x.moveTo(-13,-23);x.lineTo(-24,-30);x.stroke();
  x.fillStyle='rgba(255,240,160,.9)';x.beginPath();x.arc(-24,-30,2.2,0,7);x.fill();

    x.beginPath();x.moveTo(-12,-44);for(let i=0;i<7;i++){x.lineTo(-12+i*4,-50);x.lineTo(-10+i*4,-64-(i%2)*5)}x.lineTo(12,-44);x.quadraticCurveTo(0,-54,-12,-44);x.fill();
    x.beginPath();x.moveTo(-10,-48);x.lineTo(-13,-38);x.lineTo(-8,-44);x.fill();x.beginPath();x.moveTo(10,-48);x.lineTo(13,-38);x.lineTo(8,-44);x.fill();
    x.beginPath();x.moveTo(-10,-48);x.quadraticCurveTo(-2,-56,10,-47);x.quadraticCurveTo(2,-51,-10,-48);x.fill();

}

    if(S.st==='over')x.fillText(S.bossMode?'Quái vật còn '+S.B.hp+' máu':'Bạn chạy được '+Math.floor(p.x/10)+' m',W/2,222);

    x.fillText(S.st==='menu'?'Chạy '+GOAL+' m tới đích · Space hoặc chạm để bắt đầu':S.st==='next'?'Nhấn để bước qua cánh cửa':S.st==='win'?(lv===2?'Nhấn để dẫn các học trò về trường':'Nhấn để sang màn '+(lv+2)):'Nhấn Space hoặc chạm để chơi lại',W/2,262);
    x.font='16px system-ui,sans-serif';
    const sy=S.st==='menu'?'Các học trò của bạn bị nhốt trong căn phòng bí mật. Vượt 3 màn để tới cánh cửa cuối!':S.st==='win'?(lv===2?'Bạn đã hạ cả hai quái vật, các học trò được cứu!':'Các học trò đang chờ ở cuối con đường. Đi tiếp!'):'';
    if(S.st==='next')x.fillText('Một cánh cửa khác mở ra... quái vật mạnh hơn đang chờ!',W/2,304);else if(sy)x.fillText(sy,W/2,304);
    if(S.st==='menu')girl(W/2,396,1.3);
  }
}
function start(){
  if(S.st==='menu'||((S.st==='over'||S.st==='win'||S.st==='next'||S.st==='guide'||S.st==='story'||S.st==='home')&&S.d>25)){if(S.st==='menu'){S.st='story';S.d=0;S.pg=0;return true}if(S.st==='story'){if((S.pg||0)<2){S.pg=(S.pg||0)+1;S.d=0;return true}S.st='guide';S.d=0;S.pg=0;return true}if(S.st==='win'&&lv===2){S.st='home';S.d=0;return true}if(S.st==='home'){if(S.d<950){S.d=950;return true}lv=0;reset();return true}if(S.st==='next'){S.st='walk';S.wx=160;S.en2=0;return true}if(S.st==='over'&&S.bossMode){startBoss(S.bn);return true}if(S.st==='win')lv=(lv+1)%3;reset();return true}
  return S.st!=='play';
}
addEventListener('keyup',e=>{if(e.code==='Space')S.fire=false});
function jump(){if(S.st==='boss'){if(S.pb.g){S.pb.vy=-13;S.pb.g=false;S.pb.dj=1}else if(S.pb.dj>0){S.pb.vy=-12;S.pb.dj--}return}if(start())return;S.buf=8;S.hold=true}
function slide(){if(S.st==='boss'){dodge();return}
  if(start())return;
  const p=S.p;
  if(p.g)p.sl=36;else p.vy=15;
}
addEventListener('keydown',e=>{
  if(e.repeat)return;
  if(['ArrowUp','KeyW'].includes(e.code)){e.preventDefault();jump()}
  else if(e.code==='Space'){e.preventDefault();shoot()}
  else if(e.code==='KeyA'){e.preventDefault();pblast()}
  else if(['ArrowDown','KeyS'].includes(e.code)){e.preventDefault();slide()}
});
addEventListener('keyup',e=>{if(['Space','ArrowUp','KeyW'].includes(e.code))S.hold=false});
c.addEventListener('touchstart',e=>{
  e.preventDefault();
  const r=c.getBoundingClientRect(),y=(e.touches[0].clientY-r.top)/r.height;
  const tx=(e.touches[0].clientX-r.left)/r.width;if(tx<.13&&y<.22&&(S.st==='play'||S.st==='boss'))pblast();else if((S.st==='boss'&&tx>.6)||(S.st==='play'&&tx>.78))shoot();else y<.6?jump():slide();
},{passive:false});
c.addEventListener('touchend',()=>{S.hold=false;S.fire=false});
c.addEventListener('mousedown',()=>{jump()});
addEventListener('mouseup',()=>{S.hold=false});
reset();S.st='menu';
let last=0,acc=0;
function loop(t){
  acc+=Math.min(50,t-last);last=t;
  while(acc>=16.67){acc-=16.67;if(S.st==='play')up();else if(S.st==='boss')bup();else if(S.st==='enter')eup();else if(S.st==='walk')wup();else S.d++}
  draw();requestAnimationFrame(loop);
}
requestAnimationFrame(t=>{last=t;loop(t)});
</script>
